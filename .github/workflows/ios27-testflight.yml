name: iOS 27 signed iPhone build and TestFlight

on:
  push:
    branches: [fix/canonical-repair-20261006]
    paths: [".github/workflows/ios27-testflight.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-apple-key:
    runs-on: ubuntu-latest
    steps:
      - name: Verify credentials before renting a Mac
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [[ -n "$KEY_ID" ]] || missing="${missing} ASC_KEY_ID"
          [[ -n "$ISSUER_ID" ]] || missing="${missing} ASC_ISSUER_ID"
          [[ -n "$PRIVATE_KEY" ]] || missing="${missing} ASC_PRIVATE_KEY"
          if [[ -n "$missing" ]]; then
            echo "::error::Missing GitHub repository secrets:$missing"
            exit 1
          fi
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Invalid key ID"; exit 1; }
          [[ "$ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Invalid issuer ID"; exit 1; }
          printf '%s\n' "$PRIVATE_KEY" | openssl pkey -noout >/dev/null 2>&1 || {
            echo "::error::ASC_PRIVATE_KEY must contain the complete AuthKey .p8 text"
            exit 1
          }

  archive-and-upload:
    needs: check-apple-key
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUILD_NUMBER: "65"
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode 27 and prepare private key
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | sed -n 's/^Xcode //p')" == 27.* ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]]
          mkdir -p "$RUNNER_TEMP/asc"
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          openssl pkey -in "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" -noout
      - name: Archive with Apple automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project UniversalAssistant.xcodeproj \
            -scheme UniversalAssistant \
            -configuration Production \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UniversalAssistant.xcarchive" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) IOS27_SPEECH_PROBE' \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER= \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          app="$RUNNER_TEMP/UniversalAssistant.xcarchive/Products/Applications/UniversalAssistant.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict "$app"
          test -f "$app/embedded.mobileprovision"
          test -f "$app/PlugIns/ShareExtension.appex/embedded.mobileprovision"
      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>9V5XXDXF3N</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UniversalAssistant.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates > "$RUNNER_TEMP/export.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/export.log"
              exit 1
            }
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          mkdir -p release-artifact
          cp "$ipa" "release-artifact/UniversalAssistant-Build$BUILD_NUMBER.ipa"
          shasum -a 256 "$ipa" > release-artifact/ipa.sha256
      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" "$HOME/.appstoreconnect/private_keys/"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-package "release-artifact/UniversalAssistant-Build$BUILD_NUMBER.ipa" \
            --type ios --api-key "$KEY_ID" --api-issuer "$ISSUER_ID" --wait \
            --output-format json > release-artifact/testflight-upload.json 2>&1 || {
              tail -100 release-artifact/testflight-upload.json
              exit 1
            }
          grep -q '"build-status" *: *"VALID"' release-artifact/testflight-upload.json
      - name: Keep IPA and upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAssistant-iPhone-Build65
          path: release-artifact/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
