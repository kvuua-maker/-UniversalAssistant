name: Signed iPhone build and TestFlight

# Fully automatic signing: Xcode creates/downloads the Apple Distribution
# certificate and the App Store provisioning profile through the App Store
# Connect API. No manual .p12 or profile is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" "$HOME/.appstoreconnect/private_keys/"
          openssl pkey -in "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" -noout

      - name: ASC diagnostics (bundle id + capabilities)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/jwt.js" <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const key=fs.readFileSync(process.env.KEY_PATH,'utf8');
          const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=b64({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+
                      b64({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'});
          const sig=crypto.sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          process.stdout.write(input+'.'+sig);
          JS
          TOKEN=$(node "$RUNNER_TEMP/jwt.js")
          API=https://api.appstoreconnect.apple.com/v1
          echo "--- bundle ids for this team ---"
          curl -sf -H "Authorization: Bearer $TOKEN" \
            "$API/bundleIds?filter%5Bidentifier%5D=com.universalassistant.app&limit=5" \
            -o "$RUNNER_TEMP/bundle.json" | true
          node -e '
            const d=require(process.env.RUNNER_TEMP+"/bundle.json");
            const b=(d.data||[])[0];
            if(!b){console.log("BUNDLE_ID_NOT_FOUND");process.exit(3);}
            console.log("bundleId:",b.id,b.attributes.identifier,"platform:",b.attributes.platform,"seedId(team):",b.attributes.seedId);
          '
          BID=$(node -e 'const d=require(process.env.RUNNER_TEMP+"/bundle.json");process.stdout.write(d.data[0].id)')
          echo "--- capabilities ---"
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/bundleIds/$BID/bundleIdCapabilities" -o "$RUNNER_TEMP/caps.json"
          node -e '
            const d=require(process.env.RUNNER_TEMP+"/caps.json");
            const caps=(d.data||[]).map(c=>c.attributes.capabilityType).sort();
            console.log("count:",caps.length); console.log(caps.join(", "));
            const need=["APP_GROUPS","PUSH_NOTIFICATIONS","ICLOUD","APPLE_ID_AUTH","WEATHERKIT","APP_ATTEST"];
            const missing=need.filter(n=>!caps.includes(n));
            console.log(missing.length? "MISSING: "+missing.join(", ") : "ALL REQUIRED CAPABILITIES PRESENT");
          '
          echo "--- certificates ---"
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/certificates?limit=20" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log((d.data||[]).map(c=>c.attributes.certificateType+":"+c.attributes.displayName).join("\n")||"none")})'

      - name: Create distribution certificate and install profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com/v1
          TOKEN=$(node "$RUNNER_TEMP/jwt.js")

          # 1. Key + CSR for a fresh Apple Distribution certificate.
          openssl genrsa -out "$RUNNER_TEMP/dist.key" 2048
          openssl req -new -key "$RUNNER_TEMP/dist.key" -out "$RUNNER_TEMP/dist.csr" \
            -subj "/CN=UniversalAssistant Distribution/OU=9V5XXDXF3N/O=UniversalAssistant/C=UA"
          openssl req -in "$RUNNER_TEMP/dist.csr" -outform DER -out "$RUNNER_TEMP/dist.der"
          CSR=$(base64 -i "$RUNNER_TEMP/dist.der" | tr -d '\n')
          printf '{"data":{"type":"certificates","attributes":{"certificateType":"DISTRIBUTION","csrContent":"%s"}}}' "$CSR" > "$RUNNER_TEMP/cert.json"
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/cert.json" "$API/certificates" -o "$RUNNER_TEMP/cert-resp.json" || true
          CERT_ID=$(node -e 'try{const d=require(process.env.RUNNER_TEMP+"/cert-resp.json");process.stdout.write(d.data.id)}catch(e){}')
          if [ -n "$CERT_ID" ]; then
            curl -sf -H "Authorization: Bearer $TOKEN" "$API/certificates/$CERT_ID" -o "$RUNNER_TEMP/cert.json"
          else
            curl -sf -H "Authorization: Bearer $TOKEN" "$API/certificates?filter%5BcertificateType%5D=DISTRIBUTION&limit=1" -o "$RUNNER_TEMP/cert-list.json"
            CERT_ID=$(node -e 'const d=require(process.env.RUNNER_TEMP+"/cert-list.json");process.stdout.write(d.data[0].id)')
            curl -sf -H "Authorization: Bearer $TOKEN" "$API/certificates/$CERT_ID" -o "$RUNNER_TEMP/cert.json"
          fi
          node -e 'const d=require(process.env.RUNNER_TEMP+"/cert.json");require("fs").writeFileSync(process.env.RUNNER_TEMP+"/dist.cer",Buffer.from(d.data.attributes.certificateContent,"base64"))'
          openssl x509 -inform DER -in "$RUNNER_TEMP/dist.cer" -out "$RUNNER_TEMP/dist.pem"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/dist.key" -in "$RUNNER_TEMP/dist.pem" \
            -out "$RUNNER_TEMP/dist.p12" -passout pass:ua-temp
          security create-keychain -p ua-temp ua.keychain
          security set-keychain-settings -lut 3600 ua.keychain
          security unlock-keychain -p ua-temp ua.keychain
          security import "$RUNNER_TEMP/dist.p12" -k ua.keychain -P ua-temp -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ua-temp ua.keychain >/dev/null
          security list-keychains -d user -s ua.keychain $(security list-keychains -d user | tr -d '"')

          # 2. Download the two App Store profiles the owner created.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            NAME="$1"
            curl -sf -H "Authorization: Bearer $TOKEN" "$API/profiles?filter%5Bname%5D=$NAME&limit=1" -o "$RUNNER_TEMP/p.json"
            PID=$(node -e "const d=require('$RUNNER_TEMP/p.json');if(!d.data.length){console.log('MISSING');process.exit(4)}process.stdout.write(d.data[0].id)")
            curl -sf -H "Authorization: Bearer $TOKEN" "$API/profiles/$PID/profileContent" -o "$RUNNER_TEMP/p.b64"
            base64 -d -i "$RUNNER_TEMP/p.b64" -o "$HOME/Library/MobileDevice/Provisioning Profiles/$NAME.mobileprovision"
            echo "installed $NAME ($PID)"
          }
          install_profile UniversalAssistant_AppStore
          install_profile UniversalAssistant_ShareExtension

      - name: Archive (automatic signing via ASC API)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project UniversalAssistant.xcodeproj \
            -scheme UniversalAssistant \
            -configuration Production \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UniversalAssistant.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=9V5XXDXF3N \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.0 2>&1 | tee archive.log

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>9V5XXDXF3N</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UniversalAssistant.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log

      - name: Remove signing material
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/private_keys"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ github.run_number }}
          path: |
            asc-diagnostics.log
            archive.log
            export.log
            upload.log
          if-no-files-found: ignore
