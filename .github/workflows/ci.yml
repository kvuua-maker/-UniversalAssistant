name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    # Cheap Linux gate: no Apple-runner minute is spent unless this passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"
      - name: Install SwiftFormat and SwiftLint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/sf.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.1/swiftformat_linux.zip
          unzip -q /tmp/sf.zip -d /tmp/sf
          install -m 755 /tmp/sf/swiftformat_linux "$HOME/.local/bin/swiftformat"
          curl -sL -o /tmp/sl.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -q /tmp/sl.zip -d /tmp/sl
          install -m 755 /tmp/sl/swiftlint "$HOME/.local/bin/swiftlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Preflight
        run: ./scripts/preflight.sh

  verify:
    needs: preflight
    runs-on: macos-15
    steps:
      # The requirement audit verifies that every recorded evidence commit
      # exists, so this checkout must contain full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static configuration checks
        run: |
          git diff --check
          plutil -lint UniversalAssistant/PrivacyInfo.xcprivacy
          for file in UniversalAssistant/Resources/*.lproj/Localizable.strings; do plutil -lint "$file"; done
          python3 Scripts/reconcile_requirement_evidence.py
          git diff --exit-code REQUIREMENT_INVENTORY.json
          python3 Scripts/audit_final_requirements.py
      - name: Backend tests
        run: swift test --package-path Backend 2>&1 | tee backend-tests.log
      - name: iOS build and tests
        run: |
          set -o pipefail
          xcodebuild -project UniversalAssistant.xcodeproj -scheme UniversalAssistant -configuration Development -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios-tests.log
      - name: Release candidate identity
        run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/git-commit.txt
          xcodebuild -version > release-evidence/xcode-version.txt
          swift --version > release-evidence/swift-version.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            backend-tests.log
            ios-tests.log
            release-evidence/

  staging:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment: staging
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path Backend -c release
      - name: Produce reviewed staging artifact
        run: |
          mkdir -p staging-artifact
          cp Backend/.build/release/UniversalAssistantServer staging-artifact/
          git rev-parse HEAD > staging-artifact/git-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backend-${{ github.sha }}
          path: staging-artifact/
