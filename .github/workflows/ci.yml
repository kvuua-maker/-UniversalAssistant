name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project UniversalAssistant.xcodeproj -scheme UniversalAssistant -configuration Development -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: swift test --package-path Backend
