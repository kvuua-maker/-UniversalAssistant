limit_req_zone $binary_remote_addr zone=ua_challenge:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ua_ingest:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ua_bootstrap:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=ua_groq_audio:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ua_groq_semantic:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 178.105.32.46;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 178.105.32.46;
    ssl_certificate /etc/letsencrypt/live/178.105.32.46/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178.105.32.46/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 96k;

    location = /v1/app-attest/challenge {
        limit_req zone=ua_challenge burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/app-attest/register {
        limit_req zone=ua_challenge burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/app-attest/bootstrap-failure {
        client_max_body_size 8k;
        limit_req zone=ua_bootstrap burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/diagnostics {
        limit_req zone=ua_ingest burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/ai/transcriptions {
        # The attested JSON envelope base64-encodes already base64-encoded WAV
        # client data. The decoded WAV remains capped at 15 MB by the server.
        client_max_body_size 30m;
        limit_req zone=ua_groq_audio burst=3 nodelay;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/ai/semantic {
        client_max_body_size 16k;
        limit_req zone=ua_groq_semantic burst=5 nodelay;
        proxy_read_timeout 20s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
