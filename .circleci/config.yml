version: 2.1

parameters:
  run_repair_build:
    type: boolean
    default: true

jobs:
  repair-preflight-base:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check base build number
          command: |
            set -euo pipefail
            test "$(grep -o 'CURRENT_PROJECT_VERSION = 64;' UniversalAssistant.xcodeproj/project.pbxproj | wc -l | tr -d ' ')" -eq 6
  repair-preflight-signing:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check automatic signing configuration
          command: |
            set -euo pipefail
            test "$(grep -o 'CODE_SIGN_STYLE = Automatic;' UniversalAssistant.xcodeproj/project.pbxproj | wc -l | tr -d ' ')" -ge 2
            ! grep -Fq 'PROVISIONING_PROFILE_SPECIFIER = "Universal-Assistant' UniversalAssistant.xcodeproj/project.pbxproj
            grep -A1 '<key>signingStyle</key>' .circleci/ExportOptions.plist | grep -Fq '<string>automatic</string>'
            grep -Fq '<string>9V5XXDXF3N</string>' .circleci/ExportOptions.plist
            test -n "${ASC_KEY_ID:-}" || { echo "Missing ASC_KEY_ID"; exit 1; }
            test -n "${ASC_ISSUER_ID:-}" || { echo "Missing ASC_ISSUER_ID"; exit 1; }
            test -n "${ASC_PRIVATE_KEY_PEM:-}" || { echo "Missing ASC_PRIVATE_KEY_PEM"; exit 1; }
            key_file="$(mktemp)"
            trap 'rm -f "$key_file"' EXIT
            case "$ASC_PRIVATE_KEY_PEM" in
              *'-----BEGIN PRIVATE KEY-----'*'-----END PRIVATE KEY-----'*) ;;
              *) echo "Private key value has no complete PRIVATE KEY markers"; exit 1 ;;
            esac
            key_body="$(printf '%s' "$ASC_PRIVATE_KEY_PEM" | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' -e 's/\\n//g' | tr -d '[:space:]')"
            test -n "$key_body" || { echo "Private key body is empty"; exit 1; }
            case "$key_body" in *[!A-Za-z0-9+/=]*) echo "Private key body has invalid characters"; exit 1 ;; esac
            { printf '%s\n' '-----BEGIN PRIVATE KEY-----'; printf '%s' "$key_body" | fold -w 64; printf '%s\n' '-----END PRIVATE KEY-----'; } > "$key_file"
            openssl pkey -in "$key_file" -noout 2>/dev/null || { echo "Private key value is not a valid p8 PEM file after normalization"; exit 1; }
  repair-preflight-voice:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check iOS dictation inputs
          command: |
            set -euo pipefail
            test -f UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            grep -Fq 'startIOS27Dictation' UniversalAssistant/Voice/VoiceInputController.swift
  ios27-dictation-repair-build66:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    environment:
      BUILD_NUMBER: "66"
      ARCHIVE_PATH: /tmp/UniversalAssistant-Build66.xcarchive
      EXPORT_PATH: /tmp/UniversalAssistant-Build66-Export
      APP_STORE_ID: "6808699811"
    steps:
      - checkout
      - run:
          name: Prepare App Store Connect signing key
          command: |
            set -euo pipefail
            test -n "${ASC_KEY_ID:-}"
            test -n "${ASC_ISSUER_ID:-}"
            test -n "${ASC_PRIVATE_KEY_PEM:-}"
            key_dir="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$key_dir"
            key_body="$(printf '%s' "$ASC_PRIVATE_KEY_PEM" | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' -e 's/\\n//g' | tr -d '[:space:]')"
            { printf '%s\n' '-----BEGIN PRIVATE KEY-----'; printf '%s' "$key_body" | fold -w 64; printf '%s\n' '-----END PRIVATE KEY-----'; } > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
            chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
            openssl pkey -in "$key_dir/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null
      - run:
          name: Verify Xcode 27 Speech SDK
          command: |
            set -euo pipefail
            xcodebuild -version
            xcodebuild -showsdks
            test "$(xcodebuild -version | awk '/Xcode/ {split($2,v,"."); print v[1]}')" -ge 27
            sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
            test "${sdk_version%%.*}" -ge 27
            sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
            interface="$(find "$sdk_path/System/Library/Frameworks/Speech.framework/Modules/Speech.swiftmodule" -name '*.swiftinterface' | head -1)"
            test -n "$interface"
            grep -q 'DictationTranscriber' "$interface"
            grep -q 'progressiveShortDictation' "$interface"
            grep -q 'CaptureInputSequenceProvider' "$interface"
            grep -q 'providerWithSession' "$interface"
            grep -q 'AnalysisContext' "$interface"
            grep -q 'assetInstallationRequest' "$interface"
            grep -q 'AVAudioApplication' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            grep -q 'AVAudioApplication.requestRecordPermission()' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            test -z "$(grep -n 'SFSpeechRecognizer.requestAuthorization' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift || true)"
            grep -q 'startIOS27Dictation' UniversalAssistant/Voice/VoiceInputController.swift
            grep -q 'DictationTranscriber(locale: locale, preset: .progressiveShortDictation)' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            grep -q 'CaptureInputSequenceProvider.providerWithSession' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            test -z "$(grep -nE 'SFSpeechRecognizer|GroqCloudVoiceTranscriber|VoiceRecognitionCandidateBuilder|VoiceTranscriptStabilizer|VoiceAuthoritativeTranscriptSelector' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift || true)"
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' UniversalAssistant/Info.plist
      - run:
          name: Archive signed Build 66
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              -scheme UniversalAssistant \
              -configuration Production \
              -destination generic/platform=iOS \
              -archivePath "$ARCHIVE_PATH" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) IOS27_SPEECH_PROBE' \
              archive | tee /tmp/UniversalAssistantArchive66.log
      - run:
          name: Run full test suite
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            simulator_id="$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][] | select(.name == "iPhone 17") | .udid' | head -1)"
            test -n "$simulator_id"
            xcrun simctl boot "$simulator_id" 2>/dev/null || true
            xcrun simctl bootstatus "$simulator_id" -b
            test_log=/tmp/UniversalAssistantTests66.log
            targeted_log=/tmp/UniversalAssistantTargetedTests66.log
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild66-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG DEVELOPMENT IOS27_SPEECH_PROBE' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build-for-testing | tee /tmp/UniversalAssistantBuildForTesting66.log
            test_app=/tmp/UniversalAssistantBuild66-Tests/Build/Products/Development-iphonesimulator/UniversalAssistant.app
            test -d "$test_app"
            xcrun simctl install "$simulator_id" "$test_app"
            xcrun simctl privacy "$simulator_id" grant contacts com.universalassistant.app.dev
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild66-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -only-testing:UniversalAssistantTests/VoiceTextInputQualityTests \
              -resultBundlePath /tmp/UniversalAssistantTargetedTests66.xcresult \
              test-without-building 2>&1 | tee "$targeted_log"
            grep -Eq 'Test run with [0-9]+ tests in [0-9]+ suites? passed' "$targeted_log"
            test -z "$(grep -E 'Test run with .* failed|\*\* TEST FAILED \*\*' "$targeted_log" || true)"
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild66-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -resultBundlePath /tmp/UniversalAssistantTests66.xcresult \
              test-without-building 2>&1 | tee "$test_log"
            grep -Eq 'Test run with [0-9]+ tests in [0-9]+ suites passed' "$test_log"
            test -z "$(grep -E 'Test run with .* failed|\*\* TEST FAILED \*\*' "$test_log" || true)"
      - store_artifacts:
          path: /tmp/UniversalAssistantTests66.log
          destination: UniversalAssistantTests66.log
      - store_artifacts:
          path: /tmp/UniversalAssistantTests66.xcresult
          destination: UniversalAssistantTests66.xcresult
      - run:
          name: Verify archive and export IPA
          command: |
            set -euo pipefail
            app="$ARCHIVE_PATH/Products/Applications/UniversalAssistant.app"
            extension="$app/PlugIns/ShareExtension.appex"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "com.universalassistant.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "0.1.0"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = "com.universalassistant.app.share"
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist .circleci/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee /tmp/UniversalAssistantExport66.log
            ipa="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
            test -n "$ipa"
            verification_dir="$(mktemp -d)"
            unzip -q "$ipa" -d "$verification_dir"
            signed_app="$verification_dir/Payload/UniversalAssistant.app"
            signed_extension="$signed_app/PlugIns/ShareExtension.appex"
            codesign --verify --deep --strict "$signed_app"
            codesign -dv --verbose=4 "$signed_app" 2> /tmp/UniversalAssistantArchiveSignature.txt
            grep -q 'Authority=Apple Distribution:' /tmp/UniversalAssistantArchiveSignature.txt
            security cms -D -i "$signed_app/embedded.mobileprovision" > /tmp/UniversalAssistantArchiveAppProfile.plist
            security cms -D -i "$signed_extension/embedded.mobileprovision" > /tmp/UniversalAssistantArchiveShareProfile.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/UniversalAssistantArchiveAppProfile.plist)" = "9V5XXDXF3N.com.universalassistant.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/UniversalAssistantArchiveShareProfile.plist)" = "9V5XXDXF3N.com.universalassistant.app.share"
            rm -rf "$verification_dir"
            shasum -a 256 "$ipa" | tee /tmp/UniversalAssistantBuild66.sha256
            mkdir -p /tmp/UniversalAssistantBuild66Artifact
            cp "$ipa" /tmp/UniversalAssistantBuild66Artifact/UniversalAssistant-Build66.ipa
      - run:
          name: Upload Build 66 and await Apple processing
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            ipa=/tmp/UniversalAssistantBuild66Artifact/UniversalAssistant-Build66.ipa
            xcrun altool \
              --upload-package "$ipa" \
              --type ios \
              --api-key "$ASC_KEY_ID" \
              --api-issuer "$ASC_ISSUER_ID" \
              --wait \
              --output-format json | tee /tmp/UniversalAssistantUpload66.json
            cp /tmp/UniversalAssistantUpload66.json /tmp/UniversalAssistantBuildStatus66.json
            grep -q '"build-status" : "VALID"' /tmp/UniversalAssistantBuildStatus66.json
      - store_artifacts:
          path: /tmp/UniversalAssistantBuild66Artifact
          destination: UniversalAssistant-Build66
      - store_artifacts:
          path: /tmp/UniversalAssistantBuild66.sha256
          destination: UniversalAssistant-Build66.sha256
      - store_artifacts:
          path: /tmp/UniversalAssistantUpload66.json
          destination: UniversalAssistantUpload66.json
      - store_artifacts:
          path: /tmp/UniversalAssistantBuildStatus66.json
          destination: UniversalAssistantBuildStatus66.json

workflows:
  automatic-repair-preflight:
    jobs:
      - repair-preflight-base:
          filters:
            branches:
              only: fix/canonical-repair-20261006
      - repair-preflight-signing:
          filters:
            branches:
              only: fix/canonical-repair-20261006
      - repair-preflight-voice:
          filters:
            branches:
              only: fix/canonical-repair-20261006
  build-upload-ios27-dictation-repair:
    when: << pipeline.parameters.run_repair_build >>
    jobs:
      - repair-preflight-base:
          filters:
            branches:
              only: ci/build66-once-20261007
      - repair-preflight-signing:
          filters:
            branches:
              only: ci/build66-once-20261007
      - repair-preflight-voice:
          filters:
            branches:
              only: ci/build66-once-20261007
      - ios27-dictation-repair-build66:
          requires:
            - repair-preflight-base
            - repair-preflight-signing
            - repair-preflight-voice
          filters:
            branches:
              only: ci/build66-once-20261007
