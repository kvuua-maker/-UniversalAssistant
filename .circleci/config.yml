version: 2.1

jobs:
  ios27-dictation-probe-build64:
    macos:
      xcode: 27.0.0
      code_signing:
        - universalassistant-build60
    resource_class: m4pro.medium
    environment:
      BASELINE_SHA: 89b5a07d38a19c54b58a88285a5b9903314810db
      ARCHIVE_PATH: /tmp/UniversalAssistant-Build64.xcarchive
      EXPORT_PATH: /tmp/UniversalAssistant-Build64-Export
      APP_STORE_ID: "6808699811"
    steps:
      - install_signing_bundle
      - checkout
      - run:
          name: Verify experiment isolation
          command: |
            set -euo pipefail
            test "$(git branch --show-current)" = "experiment/ios27-speech-probe"
            git fetch --no-tags origin main checkpoint/build59-pre-ios27-speech-probe
            test "$(git rev-parse origin/main)" = "$BASELINE_SHA"
            test "$(git rev-parse origin/checkpoint/build59-pre-ios27-speech-probe)" = "$BASELINE_SHA"
            test -z "$(git diff --name-only "$BASELINE_SHA" HEAD -- \
              UniversalAssistant/Core/LanguageUnderstandingBlock.swift \
              UniversalAssistant/Voice/GroqCloudLanguageServices.swift)"
            unexpected="$(git diff --name-only "$BASELINE_SHA" HEAD | grep -Ev '^(\.circleci/(config\.yml|ExportOptions\.plist)|UniversalAssistant\.xcodeproj/project\.pbxproj|UniversalAssistant/App/(AssistantSettingsView|IOS27DictationProbeView)\.swift|UniversalAssistant/Core/AssistantViewModel\.swift|UniversalAssistant/Voice/(IOS27DictationProbeController|IOS27DictationVoiceBackend|VoiceInputController)\.swift|UniversalAssistantTests/(AccessibilityAudioPermissionTests|CommunicationAndRestaurantReleaseRootTests|VoiceInputSessionOwnershipTests|VoiceTextInputQualityTests)\.swift)$' || true)"
            test -z "$unexpected"
            test "$(xcodebuild -project UniversalAssistant.xcodeproj -scheme UniversalAssistant -configuration Production -showBuildSettings | awk '/CURRENT_PROJECT_VERSION/ {print $3; exit}')" = "64"
      - run:
          name: Verify Xcode 27 Speech SDK
          command: |
            set -euo pipefail
            xcodebuild -version
            xcodebuild -showsdks
            test "$(xcodebuild -version | awk '/Xcode/ {split($2,v,"."); print v[1]}')" -ge 27
            sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
            test "${sdk_version%%.*}" -ge 27
            sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
            interface="$(find "$sdk_path/System/Library/Frameworks/Speech.framework/Modules/Speech.swiftmodule" -name '*.swiftinterface' | head -1)"
            test -n "$interface"
            grep -q 'DictationTranscriber' "$interface"
            grep -q 'progressiveShortDictation' "$interface"
            grep -q 'CaptureInputSequenceProvider' "$interface"
            grep -q 'providerWithSession' "$interface"
            grep -q 'AnalysisContext' "$interface"
            grep -q 'assetInstallationRequest' "$interface"
            grep -q 'AVAudioApplication' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            grep -q 'AVAudioApplication.requestRecordPermission()' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            test -z "$(grep -n 'SFSpeechRecognizer.requestAuthorization' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift || true)"
            grep -q 'startIOS27Dictation' UniversalAssistant/Voice/VoiceInputController.swift
            grep -q 'DictationTranscriber(locale: locale, preset: .progressiveShortDictation)' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            grep -q 'CaptureInputSequenceProvider.providerWithSession' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift
            test -z "$(grep -nE 'SFSpeechRecognizer|GroqCloudVoiceTranscriber|VoiceRecognitionCandidateBuilder|VoiceTranscriptStabilizer|VoiceAuthoritativeTranscriptSelector' UniversalAssistant/Voice/IOS27DictationVoiceBackend.swift || true)"
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' UniversalAssistant/Info.plist
      - run:
          name: Run full test suite
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            simulator_id="$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][] | select(.name == "iPhone 17") | .udid' | head -1)"
            test -n "$simulator_id"
            xcrun simctl boot "$simulator_id" 2>/dev/null || true
            xcrun simctl bootstatus "$simulator_id" -b
            test_log=/tmp/UniversalAssistantTests64.log
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild64-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG DEVELOPMENT IOS27_SPEECH_PROBE' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build-for-testing | tee /tmp/UniversalAssistantBuildForTesting64.log
            test_app=/tmp/UniversalAssistantBuild64-Tests/Build/Products/Development-iphonesimulator/UniversalAssistant.app
            test -d "$test_app"
            xcrun simctl install "$simulator_id" "$test_app"
            xcrun simctl privacy "$simulator_id" grant contacts com.universalassistant.app.dev
            targeted_log=/tmp/UniversalAssistantTargetedTests64.log
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild64-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -only-testing:UniversalAssistantTests/VoiceTextInputQualityTests \
              -resultBundlePath /tmp/UniversalAssistantTargetedTests64.xcresult \
              test-without-building 2>&1 | tee "$targeted_log"
            grep -Eq 'Test run with [0-9]+ tests in [0-9]+ suites passed' "$targeted_log"
            test -z "$(grep -E 'Test run with .* failed|\*\* TEST FAILED \*\*' "$targeted_log" || true)"
            SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1 xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Development \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath /tmp/UniversalAssistantBuild64-Tests \
              -parallel-testing-enabled NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -resultBundlePath /tmp/UniversalAssistantTests64.xcresult \
              test-without-building 2>&1 | tee "$test_log"
            grep -Eq 'Test run with [0-9]+ tests in [0-9]+ suites passed' "$test_log"
            test -z "$(grep -E 'Test run with .* failed|\*\* TEST FAILED \*\*' "$test_log" || true)"
      - store_artifacts:
          path: /tmp/UniversalAssistantTargetedTests64.log
          destination: UniversalAssistantTargetedTests64.log
      - store_artifacts:
          path: /tmp/UniversalAssistantTargetedTests64.xcresult
          destination: UniversalAssistantTargetedTests64.xcresult
      - store_artifacts:
          path: /tmp/UniversalAssistantTests64.log
          destination: UniversalAssistantTests64.log
      - store_artifacts:
          path: /tmp/UniversalAssistantTests64.xcresult
          destination: UniversalAssistantTests64.xcresult
      - run:
          name: Compile iOS 27 probe without signing
          command: |
            set -euo pipefail
            xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Production \
              -destination generic/platform=iOS \
              -derivedDataPath /tmp/UniversalAssistantBuild64-DerivedData \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) IOS27_SPEECH_PROBE' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build | tee /tmp/UniversalAssistantBuild64.log
      - run:
          name: Archive signed Build 64
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            xcodebuild \
              -project UniversalAssistant.xcodeproj \
              -scheme UniversalAssistant \
              -configuration Production \
              -destination generic/platform=iOS \
              -archivePath "$ARCHIVE_PATH" \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) IOS27_SPEECH_PROBE' \
              archive | tee /tmp/UniversalAssistantArchive64.log
      - run:
          name: Verify archive and export IPA
          command: |
            set -euo pipefail
            app="$ARCHIVE_PATH/Products/Applications/UniversalAssistant.app"
            extension="$app/PlugIns/ShareExtension.appex"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "com.universalassistant.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "0.1.0"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "64"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = "com.universalassistant.app.share"
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=4 "$app" 2> /tmp/UniversalAssistantArchiveSignature.txt
            grep -q 'Authority=Apple Distribution:' /tmp/UniversalAssistantArchiveSignature.txt
            codesign -d --entitlements :- "$app" > /tmp/UniversalAssistantArchiveAppEntitlements.plist
            codesign -d --entitlements :- "$extension" > /tmp/UniversalAssistantArchiveShareEntitlements.plist
            security cms -D -i "$app/embedded.mobileprovision" > /tmp/UniversalAssistantArchiveAppProfile.plist
            security cms -D -i "$extension/embedded.mobileprovision" > /tmp/UniversalAssistantArchiveShareProfile.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/UniversalAssistantArchiveAppProfile.plist)" = "9V5XXDXF3N.com.universalassistant.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/UniversalAssistantArchiveShareProfile.plist)" = "9V5XXDXF3N.com.universalassistant.app.share"
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist .circleci/ExportOptions.plist | tee /tmp/UniversalAssistantExport64.log
            ipa="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
            test -n "$ipa"
            shasum -a 256 "$ipa" | tee /tmp/UniversalAssistantBuild64.sha256
            mkdir -p /tmp/UniversalAssistantBuild64Artifact
            cp "$ipa" /tmp/UniversalAssistantBuild64Artifact/UniversalAssistant-Build64.ipa
      - run:
          name: Upload Build 64 and await Apple processing
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            test -n "${ASC_KEY_ID:-}"
            test -n "${ASC_ISSUER_ID:-}"
            test -n "${ASC_PRIVATE_KEY_B64:-}"
            key_dir="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$key_dir"
            printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
            chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
            ipa=/tmp/UniversalAssistantBuild64Artifact/UniversalAssistant-Build64.ipa
            xcrun altool \
              --upload-package "$ipa" \
              --type ios \
              --api-key "$ASC_KEY_ID" \
              --api-issuer "$ASC_ISSUER_ID" \
              --wait \
              --output-format json | tee /tmp/UniversalAssistantUpload64.json
            cp /tmp/UniversalAssistantUpload64.json /tmp/UniversalAssistantBuildStatus64.json
            grep -q '"build-status" : "VALID"' /tmp/UniversalAssistantBuildStatus64.json
      - store_artifacts:
          path: /tmp/UniversalAssistantBuild64Artifact
          destination: UniversalAssistant-Build64
      - store_artifacts:
          path: /tmp/UniversalAssistantBuild64.sha256
          destination: UniversalAssistant-Build64.sha256
      - store_artifacts:
          path: /tmp/UniversalAssistantUpload64.json
          destination: UniversalAssistantUpload64.json
      - store_artifacts:
          path: /tmp/UniversalAssistantBuildStatus64.json
          destination: UniversalAssistantBuildStatus64.json

workflows:
  build-upload-ios27-dictation-probe:
    jobs:
      - ios27-dictation-probe-build64:
          filters:
            branches:
              only: experiment/ios27-speech-probe
